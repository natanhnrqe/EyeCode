<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./vs/editor/editor.main.css">
    <link rel="stylesheet" href="../eyecode-theme.css">
    <link rel="stylesheet" href="../eyecode-overlays.css">
</head>
<body>
<div id="editor"></div>
<div id="eyecode-context-layer" aria-live="polite"></div>
<script>var require = { paths: { vs: './vs' } };</script>
<script src="./vs/loader.js"></script>
<script src="../../learning/js/highlight.min.js"></script>
<script>
require(['vs/editor/editor.main'], function () {
    const EYECODE_MONACO_BRIDGE_VERSION = '6.0C.2';
    console.log('[MONACO JS] EYECODE BRIDGE LOADED ' + EYECODE_MONACO_BRIDGE_VERSION);
    const models = new Map();
    const hostUpdates = new Set();
    const completionResolvers = new Map();
    const latestCompletionRequestByModel = new Map();
    const contextOverlays = new Map();
    const overlayGenerations = new Map();
    let editorSemanticTargetHovered = false;
    let learningOverlayHovered = false;
    let handoffGeneration = 0;
    let pendingHandoffHide = null;
    let entryGracePending = false;
    let lastHoverRangeKey = null;
    let completionRequestId = 0;
    let explicitCompletionRequested = false;
    let eyeCodeCompletionState = null;
    const COMPLETION_REQUEST_TIMEOUT_MS = 5000;
    const overlayLayer = document.getElementById('eyecode-context-layer');
    let editor;
    function query(value) {
        if (!window.cefQuery) return false;
        window.cefQuery({ request: JSON.stringify(value) });
        return true;
    }
    function modelKey(id) {
        if (!id) return id;
        try { return monaco.Uri.parse(id).toString(); }
        catch (error) { return id; }
    }
    function modelForId(id) {
        return models.get(modelKey(id));
    }
    function getModel(command) {
        let model = modelForId(command.id);
        if (!model) {
            model = monaco.editor.createModel(command.content || '', command.language || 'java', monaco.Uri.parse(command.id));
            models.set(model.uri.toString(), model);
            model.onDidChangeContent(function (event) {
                hideEyeCodeCompletion('contentChanged');
                cancelCompletionsForModel(command.id);
                if (hostUpdates.delete(command.id)) return;
                if (editor && editor.getModel() === model) query({ kind: 'change', id: command.id, content: model.getValue(), version: model.getAlternativeVersionId() });
                if (editor && editor.getModel() === model && eventContainsEyeCodeTrigger(event)) {
                    requestEyeCodeCompletion(false, eventContainsMemberAccess(event) ? '.' : null);
                }
            });
        }
        return model;
    }
    window.eyecodeMonacoCommand = function (command) {
        if (command.type === 'openModel') getModel(command);
        else if (command.type === 'activateModel') { const model = modelForId(command.id); if (model && editor) { hideEyeCodeCompletion('modelActivated'); cancelCompletionsExcept(command.id); editor.setModel(model); editor.updateOptions({ readOnly: !!command.readOnly }); editor.focus(); emitCaret(); } }
        else if (command.type === 'updateModel') { const model = modelForId(command.id); if (model && model.getValue() !== command.content) { hostUpdates.add(command.id); model.setValue(command.content || ''); } }
        else if (command.type === 'closeModel') { const model = modelForId(command.id); if (model) { hideEyeCodeCompletion('modelClosed'); cancelCompletionsForModel(command.id); if (editor && editor.getModel() === model) editor.setModel(null); models.delete(model.uri.toString()); model.dispose(); } }
        else if (command.type === 'setReadOnly' && editor && editor.getModel() === modelForId(command.id)) editor.updateOptions({ readOnly: !!command.readOnly });
        else if (command.type === 'revealPosition') { const model = modelForId(command.id); if (model && editor) { hideEyeCodeCompletion('revealPosition'); editor.setModel(model); editor.setPosition({ lineNumber: command.line, column: command.column }); editor.revealPositionInCenter({ lineNumber: command.line, column: command.column }); } }
        else if (command.type === 'focus' && editor) editor.focus();
        else if (command.type === 'layout' && editor) editor.layout();
        else if (command.type === 'applyEdit') {
            const model = modelForId(command.id);
            if (model && editor && editor.getModel() === model) {
                const start = model.getPositionAt(command.start);
                const end = model.getPositionAt(command.end);
                editor.executeEdits('eyecode.completion', [{
                    range: { startLineNumber: start.lineNumber, startColumn: start.column,
                        endLineNumber: end.lineNumber, endColumn: end.column },
                    text: command.text, forceMoveMarkers: true
                }]);
                editor.focus();
            }
        }
        else if (command.type === 'insertSnippet') {
            const model = modelForId(command.id);
            if (model && editor && editor.getModel() === model) {
                const start = model.getPositionAt(command.start);
                const end = model.getPositionAt(command.end);
                editor.trigger('eyecode.completion', 'editor.action.insertSnippet', {
                    snippet: command.snippet,
                    range: { startLineNumber: start.lineNumber, startColumn: start.column,
                        endLineNumber: end.lineNumber, endColumn: end.column }
                });
                editor.focus();
            }
        }
        else if (command.type === 'completionResponse') {
            query({ kind: 'completionDebug', stage: 'command', requestId: command.requestId,
                itemCount: (command.items || []).length, modelId: command.id });
            settleCompletion(command);
        }
        else if (command.type === 'showOverlay') showContextOverlay(command);
        else if (command.type === 'updateOverlay') updateContextOverlay(command);
        else if (command.type === 'hideOverlay') hideContextOverlay(command);
    };
    function acceptsOverlayGeneration(command) {
        const current = overlayGenerations.get(command.overlayId);
        if (current !== undefined && command.generation < current) return false;
        overlayGenerations.set(command.overlayId, command.generation);
        return true;
    }
    function overlayAnchor(command) {
        if (!editor) return null;
        const position = editor.getScrolledVisiblePosition({ lineNumber: command.line, column: command.column });
        if (!position) return null;
        return { left: position.left, top: position.top + position.height };
    }
    function positionContextOverlay(node, command) {
        const anchor = overlayAnchor(command);
        if (!anchor) return;
        const width = node.offsetWidth;
        const height = node.offsetHeight;
        const maxX = Math.max(0, overlayLayer.clientWidth - width - 8);
        const maxY = Math.max(0, overlayLayer.clientHeight - height - 8);
        let left = anchor.left;
        if (left + width > overlayLayer.clientWidth - 8) left = anchor.left - width - 4;
        let top = anchor.top;
        if (top + height > overlayLayer.clientHeight - 8) top = anchor.top - height - 4;
        node.style.left = Math.min(Math.max(8, left), maxX) + 'px';
        node.style.top = Math.min(Math.max(8, top), maxY) + 'px';
    }
    function emitOverlayPointer(overlayId, generation, entered) {
        query({ kind: 'overlayPointer', overlayId: overlayId, generation: generation, entered: entered });
    }
    function emitOverlayHidden(overlayId, generation) {
        query({ kind: 'overlayHidden', overlayId: overlayId, generation: generation });
    }
    function createContextOverlay(command) {
        const node = document.createElement('div');
        node._overlayGeneration = command.generation;
        node.className = 'eyecode-context-overlay eyecode-context-' + String(command.overlayType || 'LEARNING').toLowerCase();
        node.setAttribute('role', 'dialog');
        renderOverlayContent(node, command);
        node.addEventListener('pointerenter', function () {
            if (command.overlayId === 'learning') {
                learningOverlayHovered = true;
                cancelHandoffHide();
            }
            emitOverlayPointer(command.overlayId, node._overlayGeneration, true);
        });
        node.addEventListener('pointerleave', function () {
            if (command.overlayId === 'learning') {
                learningOverlayHovered = false;
                scheduleHandoffHide();
            }
            emitOverlayPointer(command.overlayId, node._overlayGeneration, false);
        });
        node.addEventListener('click', function (event) {
            const actionNode = event.target.closest('[data-action]');
            if (actionNode) query({ kind: 'overlayAction', overlayId: command.overlayId,
                action: actionNode.getAttribute('data-action'), target: actionNode.getAttribute('data-target') || '', generation: node._overlayGeneration });
        });
        return node;
    }
    function showContextOverlay(command) {
        if (!acceptsOverlayGeneration(command)) return;
        if (command.overlayId === 'learning') cancelHandoffHide();
        const previous = contextOverlays.get(command.overlayId);
        if (previous) previous.remove();
        const node = createContextOverlay(command);
        contextOverlays.set(command.overlayId, node);
        overlayLayer.appendChild(node);
        positionContextOverlay(node, command);
    }
    function updateContextOverlay(command) {
        if (!acceptsOverlayGeneration(command)) return;
        const node = contextOverlays.get(command.overlayId);
        if (!node) {
            showContextOverlay(command);
            return;
        }
        node._overlayGeneration = command.generation;
        node.className = 'eyecode-context-overlay eyecode-context-' + String(command.overlayType || 'LEARNING').toLowerCase();
        renderOverlayContent(node, command);
        positionContextOverlay(node, command);
    }
    function escapeText(value) {
        return String(value == null ? '' : value).replace(/[&<>\"']/g, function (character) {
            return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;' }[character];
        });
    }
    function learningLink(action, label, target) {
        return '<a href="#" data-action="' + action + '" data-target="' + escapeText(target) + '">' + escapeText(label) + '</a>';
    }
    function semanticIconFor(kind, url) {
        if (url) return '<img class="eyecode-learning-icon" alt="" src="' + escapeText(url) + '">';
        const labels = { METHOD: 'M', FIELD: 'F', CLASS: 'C', INTERFACE: 'I', ENUM: 'E', RECORD: 'R', KEYWORD: 'K', LEARNING: '•' };
        return '<span class="eyecode-learning-icon" aria-hidden="true">' + escapeText(labels[kind] || labels.LEARNING) + '</span>';
    }
    function highlightLearningCode(node) {
        if (!window.hljs || typeof window.hljs.highlightElement !== 'function') return;
        node.querySelectorAll('pre code').forEach(function (block) { window.hljs.highlightElement(block); });
    }
    function renderLearningOverlay(node, payload) {
        const breadcrumb = (payload.breadcrumb || []).map(function (item) {
            return learningLink('NAVIGATE_LEARNING', item.title, item.id);
        }).join(' <span>›</span> ');
        const commonMethods = (payload.commonMethods || []).map(function (item) {
            return learningLink('NAVIGATE_LEARNING', item.title, item.id);
        }).join(' ');
        const related = (payload.relatedItems || []).map(function (item) {
            return learningLink('NAVIGATE_LEARNING', item.title, item.id);
        }).join(' · ');
        const actions = [];
        if (payload.docsAvailable) actions.push(learningLink('OPEN_DOCS', 'API Docs', ''));
        if (payload.sourceAvailable) actions.push(learningLink('OPEN_SOURCE', 'View Source </>', ''));
        node.classList.remove('eyecode-learning-size-quick', 'eyecode-learning-size-medium', 'eyecode-learning-size-full');
        node.classList.add('eyecode-learning-size-' + String(payload.sizeClass || 'full').toLowerCase());
        node.innerHTML = '<div class="eyecode-learning-card">'
            + '<header class="eyecode-learning-header"><div class="eyecode-learning-title-row">'
            + semanticIconFor(payload.iconKind, payload.iconUrl) + '<div class="eyecode-learning-title">'
            + escapeText(payload.title) + '</div></div><div class="eyecode-learning-subtitle">'
            + escapeText(payload.subtitle) + '</div>'
            + (breadcrumb ? '<div class="eyecode-learning-breadcrumb">' + breadcrumb + '</div>' : '')
            + '</header><section class="eyecode-learning-body">' + (payload.renderedBodyHtml || '')
            + '</section>' + (commonMethods ? '<section class="eyecode-learning-common-methods"><span>Common methods</span><div>' + commonMethods + '</div></section>' : '')
            + ((related || actions.length) ? '<footer class="eyecode-learning-footer">'
            + (related ? '<div class="eyecode-learning-related"><span>Related</span><div>' + related + '</div></div>' : '')
            + (actions.length ? '<div class="eyecode-learning-actions">' + actions.join('') + '</div>' : '') + '</footer>' : '')
            + '</div>';
        const firstHeading = node.querySelector('.eyecode-learning-body h1');
        if (firstHeading && firstHeading.textContent.trim() === String(payload.title || '').trim()) firstHeading.remove();
        highlightLearningCode(node);
    }
    function renderOverlayContent(node, command) {
        if (String(command.overlayType || '').toUpperCase() !== 'LEARNING') {
            node.textContent = command.content || '';
            return;
        }
        try { renderLearningOverlay(node, JSON.parse(command.content || '{}')); }
        catch (error) { node.textContent = ''; }
    }
    function hideContextOverlay(command) {
        if (!acceptsOverlayGeneration(command)) return;
        if (command.overlayId === 'learning') {
            if (!command.hard) {
                if (learningOverlayHovered) {
                    cancelHandoffHide();
                    return;
                }
                if (editorSemanticTargetHovered) return;
                scheduleHandoffHide();
                return;
            }
            learningOverlayHovered = false;
            cancelHandoffHide();
        }
        const node = contextOverlays.get(command.overlayId);
        if (node) node.remove();
        contextOverlays.delete(command.overlayId);
    }
    function cancelHandoffHide() {
        handoffGeneration++;
        entryGracePending = false;
        if (pendingHandoffHide !== null) {
            clearTimeout(pendingHandoffHide);
            pendingHandoffHide = null;
        }
    }
    function scheduleHandoffHide() {
        if (learningOverlayHovered || editorSemanticTargetHovered) return;
        cancelHandoffHide();
        entryGracePending = true;
        const ticket = handoffGeneration;
        pendingHandoffHide = setTimeout(function () {
            pendingHandoffHide = null;
            entryGracePending = false;
            if (ticket !== handoffGeneration || learningOverlayHovered || editorSemanticTargetHovered) return;
            const node = contextOverlays.get('learning');
            if (node) node.remove();
            contextOverlays.delete('learning');
            if (node) emitOverlayHidden('learning', node._overlayGeneration);
        }, 140);
    }
    function completionIconFor(kind) {
        const icons = { METHOD: 'method', CONSTRUCTOR: 'method', FIELD: 'field', VARIABLE: 'variable',
            CLASS: 'class', RECORD: 'class', INTERFACE: 'interface', ENUM: 'class', PACKAGE: 'package',
            KEYWORD: 'keyword', SNIPPET: 'snippet' };
        return '../../icons/completion/' + (icons[kind] || 'variable') + '.svg';
    }
    function hideEyeCodeCompletion(reason) {
        const node = document.getElementById('eyecode-completion-popup');
        if (node) node.remove();
        eyeCodeCompletionState = null;
    }
    function completionIsCurrent() {
        const state = eyeCodeCompletionState;
        const model = editor && editor.getModel();
        return !!state && !!model && state.items.length > 0 && state.selected >= 0
            && state.selected < state.items.length && model === state.model
            && model.uri.toString() === state.modelId
            && model.getAlternativeVersionId() === state.version;
    }
    function completionSignature(item) {
        const label = item.label || '';
        const signature = item.signature || '';
        const labelIndex = signature.indexOf(label);
        if (labelIndex >= 0) {
            return { name: label, suffix: signature.substring(labelIndex + label.length) };
        }
        return { name: label, suffix: signature && signature !== label ? ' ' + signature : '' };
    }
    function renderCompletionDetails(state) {
        const item = state.items[state.selected];
        const node = document.getElementById('eyecode-completion-details');
        if (!node || !item) return;
        const signature = completionSignature(item);
        const documentation = item.documentation ? '<p class="eyecode-completion-documentation">' + escapeText(item.documentation) + '</p>' : '';
        const example = item.example ? '<div class="eyecode-completion-example"><span>Example</span><pre><code>' + escapeText(item.example) + '</code></pre></div>' : '';
        const footerTitle = (item.returnType ? '<span class="eyecode-completion-detail-return">' + escapeText(item.returnType) + '</span>' : '')
            + '<span class="eyecode-completion-detail-name">' + escapeText(signature.name) + '</span>'
            + '<span class="eyecode-completion-detail-suffix">' + escapeText(signature.suffix) + '</span>';
        node.innerHTML = '<div class="eyecode-completion-detail-header"><div class="eyecode-completion-detail-title">'
            + footerTitle + '</div>' + (item.owner ? '<span class="eyecode-completion-detail-owner">'
            + escapeText(item.owner) + '</span>' : '') + '</div>'
            + (item.category ? '<div class="eyecode-completion-category">' + escapeText(item.category) + '</div>' : '')
            + documentation + example;
    }
    function renderCompletionPopup() {
        const state = eyeCodeCompletionState;
        const node = document.getElementById('eyecode-completion-popup');
        if (!state || !node) return;
        const list = node.querySelector('#eyecode-completion-list');
        list.innerHTML = state.items.map(function (item, index) {
            const selected = index === state.selected ? ' is-selected' : '';
            const signature = completionSignature(item);
            return '<div class="eyecode-completion-row' + selected + '" data-index="' + index + '" role="option" aria-selected="' + (index === state.selected) + '">'
                + '<img class="eyecode-completion-icon" alt="" src="' + completionIconFor(item.kind) + '">'
                + '<span class="eyecode-completion-name"><span class="eyecode-completion-label">' + escapeText(signature.name)
                + '</span><span class="eyecode-completion-signature">' + escapeText(signature.suffix) + '</span></span>'
                + '<span class="eyecode-completion-return">' + escapeText(item.returnType || '') + '</span>'
                + '<span class="eyecode-completion-owner">' + escapeText(item.owner || '') + '</span></div>';
        }).join('');
        const selectedRow = list.querySelector('.eyecode-completion-row.is-selected');
        if (selectedRow) selectedRow.scrollIntoView({ block: 'nearest' });
        list.querySelectorAll('.eyecode-completion-row').forEach(function (row) {
            row.addEventListener('mouseenter', function () {
                if (!completionIsCurrent()) return;
                state.selected = Number(row.getAttribute('data-index'));
                renderCompletionPopup();
            });
            row.addEventListener('mousedown', function (event) { event.preventDefault(); });
            row.addEventListener('click', function () { acceptEyeCodeCompletion(); });
        });
        renderCompletionDetails(state);
        const selected = list.querySelector('.is-selected');
        if (selected) selected.scrollIntoView({ block: 'nearest' });
    }
    function positionCompletionPopup(node) {
        const state = eyeCodeCompletionState;
        if (!editor || !state) return;
        const position = editor.getPosition();
        const anchor = position && editor.getScrolledVisiblePosition(position);
        if (!anchor) return;
        const editorBounds = editor.getDomNode().getBoundingClientRect();
        const overlayBounds = overlayLayer.getBoundingClientRect();
        const maxX = Math.max(8, overlayLayer.clientWidth - node.offsetWidth - 8);
        const maxY = Math.max(8, overlayLayer.clientHeight - node.offsetHeight - 8);
        let left = editorBounds.left - overlayBounds.left + anchor.left;
        let top = editorBounds.top - overlayBounds.top + anchor.top + anchor.height;
        if (left + node.offsetWidth > overlayLayer.clientWidth - 8) left -= node.offsetWidth;
        if (top + node.offsetHeight > overlayLayer.clientHeight - 8) top -= node.offsetHeight;
        node.style.left = Math.min(Math.max(8, left), maxX) + 'px';
        node.style.top = Math.min(Math.max(8, top), maxY) + 'px';
    }
    function showEyeCodeCompletion(response, pending) {
        if (!editor || !pending || !response.items || !response.items.length) {
            hideEyeCodeCompletion('emptyResponse');
            return;
        }
        const model = editor.getModel();
        if (model !== pending.model || model.getAlternativeVersionId() !== pending.modelVersion) {
            hideEyeCodeCompletion('stale');
            return;
        }
        hideEyeCodeCompletion('replacePopup');
        eyeCodeCompletionState = { requestId: pending.requestId, modelId: pending.modelId,
            model: pending.model, version: pending.modelVersion, items: response.items, selected: 0 };
        const node = document.createElement('section');
        node.id = 'eyecode-completion-popup';
        node.className = 'eyecode-completion-popup';
        node.setAttribute('role', 'listbox');
        node.innerHTML = '<div id="eyecode-completion-list"></div><div id="eyecode-completion-details"></div>';
        overlayLayer.appendChild(node);
        renderCompletionPopup();
        positionCompletionPopup(node);
    }
    function acceptEyeCodeCompletion() {
        if (!completionIsCurrent()) return;
        const state = eyeCodeCompletionState;
        const item = state.items[state.selected];
        const model = state.model;
        const start = model.getPositionAt(item.replaceStart);
        const end = model.getPositionAt(item.replaceEnd);
        const range = { startLineNumber: start.lineNumber, startColumn: start.column,
            endLineNumber: end.lineNumber, endColumn: end.column };
        hideEyeCodeCompletion('accepted');
        if (item.snippet) {
            editor.trigger('eyecode.completion', 'editor.action.insertSnippet', { snippet: item.insertText, range: range });
        } else {
            editor.executeEdits('eyecode.completion', [{ range: range, text: item.insertText, forceMoveMarkers: true }]);
        }
        editor.focus();
    }
    function handleEyeCodeCompletionKey(event) {
        const key = event.keyCode;
        if (!completionIsCurrent()) return;
        const state = eyeCodeCompletionState;
        function consumeCompletionKey() {
            if (event.browserEvent) {
                event.browserEvent.preventDefault();
                event.browserEvent.stopPropagation();
            }
            event.preventDefault();
            event.stopPropagation();
        }
        if (key === monaco.KeyCode.UpArrow || key === monaco.KeyCode.DownArrow) {
            state.selected = (state.selected + (key === monaco.KeyCode.DownArrow ? 1 : state.items.length - 1)) % state.items.length;
            consumeCompletionKey();
            renderCompletionPopup();
        } else if (key === monaco.KeyCode.Enter || key === monaco.KeyCode.Tab) {
            consumeCompletionKey(); acceptEyeCodeCompletion();
        } else if (key === monaco.KeyCode.Escape) {
            consumeCompletionKey(); hideEyeCodeCompletion('escape');
        }
    }
    function completeWithEmpty(pending, reason) {
        if (!pending || pending.settled) return;
        if (eyeCodeCompletionState && eyeCodeCompletionState.requestId === pending.requestId) hideEyeCodeCompletion(reason || 'cancelled');
        pending.settled = true;
        if (pending.timeout) window.clearTimeout(pending.timeout);
        if (completionResolvers.get(pending.requestId) === pending) {
            completionResolvers.delete(pending.requestId);
        }
        if (latestCompletionRequestByModel.get(modelKey(pending.modelId)) === pending.requestId) {
            latestCompletionRequestByModel.delete(modelKey(pending.modelId));
        }
        if (pending.cancellation) pending.cancellation.dispose();
        pending.resolve({ suggestions: [] });
    }
    function cancelCompletionsForModel(modelId) {
        Array.from(completionResolvers.values()).forEach(function (pending) {
            if (pending.modelId === modelKey(modelId)) completeWithEmpty(pending, 'cancelled');
        });
        latestCompletionRequestByModel.delete(modelKey(modelId));
    }
    function cancelCompletionsExcept(modelId) {
        Array.from(completionResolvers.values()).forEach(function (pending) {
            if (pending.modelId !== modelKey(modelId)) completeWithEmpty(pending, 'cancelled');
        });
    }
    function settleCompletion(response) {
        const pending = completionResolvers.get(response.requestId);
        const currentModelAtLookup = modelForId(response.id);
        query({ kind: 'completionDebug', stage: 'settle', requestId: response.requestId,
            pendingFound: !!pending, itemCount: (response.items || []).length,
            modelId: response.id, pendingModelId: pending ? pending.modelId : null,
            currentVersion: currentModelAtLookup ? currentModelAtLookup.getAlternativeVersionId() : -1,
            pendingVersion: pending ? pending.modelVersion : -1, stale: false, suggestions: 0 });
        if (!pending) return;
        if (pending.settled) return;
        pending.settled = true;
        completionResolvers.delete(response.requestId);
        if (pending.timeout) window.clearTimeout(pending.timeout);
        if (pending.cancellation) pending.cancellation.dispose();
        const currentModel = modelForId(response.id);
        const currentVersion = currentModel ? currentModel.getAlternativeVersionId() : -1;
        const stale = pending.modelId !== response.id || currentModel !== pending.model
                || currentVersion !== pending.modelVersion;
        console.log('EYECODE_JS_RECEIVE count=' + (response.items || []).length);
        if (stale) {
            hideEyeCodeCompletion('stale');
            query({ kind: 'completionDebug', stage: 'resolve', requestId: response.requestId,
                pendingFound: true, itemCount: (response.items || []).length, modelId: response.id,
                pendingModelId: pending.modelId, currentVersion: currentVersion,
                pendingVersion: pending.modelVersion, stale: true, suggestions: 0 });
            pending.resolve({ suggestions: [] });
            return;
        }
        try {
            query({ kind: 'completionDebug', stage: 'resolve', requestId: response.requestId,
                pendingFound: true, itemCount: (response.items || []).length, modelId: response.id,
                pendingModelId: pending.modelId, currentVersion: currentVersion,
                pendingVersion: pending.modelVersion, stale: false,
                suggestions: response.items.length });
            pending.resolve({ suggestions: [] });
        } catch (error) {
            console.error('[MONACO COMPLETION] response mapping failed', error);
            query({ kind: 'completionDebug', stage: 'resolve', requestId: response.requestId,
                pendingFound: true, itemCount: (response.items || []).length, modelId: response.id,
                pendingModelId: pending.modelId, currentVersion: currentVersion,
                pendingVersion: pending.modelVersion, stale: false, suggestions: 0 });
            pending.resolve({ suggestions: [] });
        }
    }
    function requestCompletion(model, position, context, token) {
        hideEyeCodeCompletion('newRequest');
        const requestId = ++completionRequestId;
        const modelId = model.uri.toString();
        const word = model.getWordUntilPosition(position)
            || { startColumn: position.column, endColumn: position.column };
        const replaceStart = model.getOffsetAt({ lineNumber: position.lineNumber, column: word.startColumn });
        const replaceEnd = model.getOffsetAt({ lineNumber: position.lineNumber, column: word.endColumn });
        const modelVersion = model.getAlternativeVersionId();
        latestCompletionRequestByModel.set(modelKey(modelId), requestId);
        const trigger = context && context.triggerKind === monaco.languages.CompletionTriggerKind.TriggerCharacter
            ? 'triggerCharacter' : 'invoked';
        return new Promise(function (resolve) {
            const pending = { requestId: requestId, resolve: resolve, modelId: modelId,
                model: model, modelVersion: modelVersion, cancellation: null, timeout: null, settled: false };
            completionResolvers.set(requestId, pending);
            if (token) pending.cancellation = token.onCancellationRequested(function () {
                console.log('COMPLETE JS_CANCEL id=' + requestId);
                completeWithEmpty(pending, 'cancelled');
            });
            pending.timeout = window.setTimeout(function () { completeWithEmpty(pending, 'timeout'); },
                COMPLETION_REQUEST_TIMEOUT_MS);
            try {
                const sent = query({ kind: 'completion', requestId: requestId, id: modelId,
                    version: modelVersion, line: position.lineNumber,
                    column: position.column, triggerKind: trigger,
                    triggerCharacter: context && context.triggerCharacter || null,
                    explicit: explicitCompletionRequested, offset: model.getOffsetAt(position),
                    replaceStart: replaceStart, replaceEnd: replaceEnd, content: model.getValue() });
                if (!sent) completeWithEmpty(pending, 'cancelled');
            } catch (error) {
                console.error('[MONACO COMPLETION] bridge request failed', error);
                completeWithEmpty(pending, 'cancelled');
            } finally {
                explicitCompletionRequested = false;
            }
        });
    }
    function eventContainsEyeCodeTrigger(event) {
        return !!event && Array.isArray(event.changes)
            && event.changes.some(function (change) { return isRelevantCompletionChange(change); });
    }
    function eventContainsMemberAccess(event) {
        return !!event && Array.isArray(event.changes)
            && event.changes.some(function (change) { return change.text === '.'; });
    }
    function isRelevantCompletionChange(change) {
        const text = change && change.text || '';
        return text === '' && change && change.rangeLength > 0
            || /^[\p{L}\p{N}_$.]+$/u.test(text);
    }
    function requestEyeCodeCompletion(explicit, triggerCharacter) {
        if (!editor) return;
        const model = editor.getModel();
        const position = editor.getPosition();
        if (!model || !position || model.uri.toString().indexOf('jdk://') === 0) return;
        explicitCompletionRequested = !!explicit;
        const context = triggerCharacter
            ? { triggerKind: monaco.languages.CompletionTriggerKind.TriggerCharacter,
                triggerCharacter: triggerCharacter }
            : { triggerKind: monaco.languages.CompletionTriggerKind.Invoked };
        requestCompletion(model, position, context, null);
    }
    window.addEventListener('beforeunload', function () {
        hideEyeCodeCompletion('beforeUnload');
        Array.from(completionResolvers.values()).forEach(completeWithEmpty);
    });
    monaco.editor.defineTheme('eyecode-dark', {
        base: 'vs-dark',
        inherit: false,
        colors: {
            'editor.background': '#191a1c',
            'editor.foreground': '#bcbec4',
            'editorGutter.background': '#191a1c',
            'editorLineNumber.foreground': '#787878',
            'editorLineNumber.activeForeground': '#9196a0',
            'editor.lineHighlightBackground': '#202226',
            'editor.selectionBackground': '#3574f055',
            'editor.inactiveSelectionBackground': '#3574f033',
            'editor.selectionHighlightBackground': '#3574f022',
            'editorCursor.foreground': '#dcdcdc',
            'editorBracketMatch.background': '#3574f022',
            'editorBracketMatch.border': '#3574f088',
            'editorBracketHighlight.foreground1': '#4ec9b0',
            'editorBracketHighlight.foreground2': '#56a8f5',
            'editorBracketHighlight.foreground3': '#cf8e6d',
            'editorBracketHighlight.foreground4': '#b3ae60',
            'editorBracketHighlight.unexpectedBracket.foreground': '#cf8e6d',
            'editorIndentGuide.background1': '#3c3f4144',
            'editorIndentGuide.activeBackground1': '#9196a066',
            'scrollbarSlider.background': '#43464c88',
            'scrollbarSlider.hoverBackground': '#575a6088',
            'scrollbarSlider.activeBackground': '#646870aa',
            'editorOverviewRuler.border': '#191a1c'
        },
        rules: [
            { token: 'comment', foreground: '7a7e85' },
            { token: 'comment.doc', foreground: '7a7e85' },
            { token: 'keyword', foreground: 'cf8e6d' },
            { token: 'keyword.non-sealed', foreground: 'cf8e6d' },
            { token: 'type.identifier', foreground: '4ec9b0' },
            { token: 'identifier', foreground: 'bcbec4' },
            { token: 'annotation', foreground: 'b3ae60' },
            { token: 'string', foreground: '6aab73' },
            { token: 'string.escape', foreground: '6aab73' },
            { token: 'number', foreground: '2aacb8' },
            { token: 'number.float', foreground: '2aacb8' },
            { token: 'number.hex', foreground: '2aacb8' },
            { token: 'delimiter', foreground: 'a9b7c6' },
            { token: 'delimiter.bracket', foreground: 'a9b7c6' },
            { token: 'operator', foreground: 'bcbec4' }
        ]
    });
    editor = monaco.editor.create(document.getElementById('editor'), { theme: 'eyecode-dark', fontFamily: 'JetBrains Mono', fontSize: 13, fontLigatures: false, minimap: { enabled: false }, automaticLayout: true, scrollBeyondLastLine: false, smoothScrolling: false, quickSuggestions: false, wordBasedSuggestions: false, suggestOnTriggerCharacters: false, snippetSuggestions: 'inline', bracketPairColorization: { enabled: true, independentColorPoolPerBracketType: true }, guides: { bracketPairs: true, bracketPairsHorizontal: false, highlightActiveBracketPair: true } });
    editor.onKeyDown(handleEyeCodeCompletionKey);
    function emitCaret() { const model = editor.getModel(); const position = editor.getPosition(); const visible = position && editor.getScrolledVisiblePosition(position); if (model && position) { const x = visible ? visible.left : 0; const y = visible ? visible.top + visible.height : 0; query({ kind: 'caret', id: model.uri.toString(), version: model.getAlternativeVersionId(), line: position.lineNumber, column: position.column, x: x, y: y }); } }
    editor.onDidChangeCursorPosition(function () { hideEyeCodeCompletion('cursorChanged'); emitCaret(); });
    console.log('[MONACO JS] CARET_HANDLER_REGISTERED');
    editor.onDidChangeCursorSelection(function (event) { emitCaret(); });
    editor.onDidScrollChange(function () {
        const node = document.getElementById('eyecode-completion-popup');
        if (node && completionIsCurrent()) positionCompletionPopup(node);
    });
    window.addEventListener('resize', function () {
        const node = document.getElementById('eyecode-completion-popup');
        if (node && completionIsCurrent()) positionCompletionPopup(node);
    });
    editor.onMouseMove(function (event) {
        const model = editor.getModel();
        const position = event.target && event.target.position;
        if (!model) return;
        if (!position || event.target.type !== monaco.editor.MouseTargetType.CONTENT_TEXT) {
            editorSemanticTargetHovered = false;
            lastHoverRangeKey = null;
            scheduleHandoffHide();
            query({ kind: 'hoverExit', id: model.uri.toString(), version: model.getAlternativeVersionId() });
            return;
        }
        editorSemanticTargetHovered = true;
        cancelHandoffHide();
        const word = model.getWordAtPosition(position);
        if (!word) {
            editorSemanticTargetHovered = false;
            lastHoverRangeKey = null;
            scheduleHandoffHide();
            query({ kind: 'hoverExit', id: model.uri.toString(), version: model.getAlternativeVersionId() });
            return;
        }
        const startOffset = word ? model.getOffsetAt({ lineNumber: position.lineNumber, column: word.startColumn }) : 0;
        const endOffset = word ? model.getOffsetAt({ lineNumber: position.lineNumber, column: word.endColumn }) : 0;
        const rangeKey = word
            ? model.uri.toString() + ':' + model.getAlternativeVersionId() + ':'
                + position.lineNumber + ':' + word.startColumn + ':' + word.endColumn
            : model.uri.toString() + ':' + model.getAlternativeVersionId() + ':none:'
                + position.lineNumber + ':' + position.column;
        if (rangeKey === lastHoverRangeKey) return;
        lastHoverRangeKey = rangeKey;
        const visible = editor.getScrolledVisiblePosition(position);
        if (visible) query({ kind: 'hover', id: model.uri.toString(), version: model.getAlternativeVersionId(), line: position.lineNumber, column: position.column, x: visible.left, y: visible.top + visible.height, start: startOffset, end: endOffset, word: word ? word.word : '' });
    });
    console.log('[MONACO JS] HOVER_HANDLER_REGISTERED');
    editor.onMouseLeave(function () {
        editorSemanticTargetHovered = false;
        lastHoverRangeKey = null;
        scheduleHandoffHide();
        const model = editor.getModel();
        if (model) query({ kind: 'hoverExit', id: model.uri.toString(), version: model.getAlternativeVersionId() });
    });
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Space, function () {
        requestEyeCodeCompletion(true, null);
    });
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyB, function () { const model = editor.getModel(); const position = editor.getPosition(); if (model && position) { console.log('[MONACO JS] COMMAND_EMIT GO_TO_DEFINITION'); query({ kind: 'command', command: 'definition', id: model.uri.toString(), version: model.getAlternativeVersionId(), line: position.lineNumber, column: position.column }); } });
    console.log('[MONACO JS] CTRL_B_REGISTERED');
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyQ, function () { const model = editor.getModel(); const position = editor.getPosition(); if (model && position) { console.log('[MONACO JS] COMMAND_EMIT DOCUMENTATION'); query({ kind: 'command', command: 'documentation', id: model.uri.toString(), version: model.getAlternativeVersionId(), line: position.lineNumber, column: position.column }); } });
    console.log('[MONACO JS] CTRL_Q_REGISTERED');
    query({ kind: 'ready' });
});
</script>
